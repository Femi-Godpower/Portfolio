name: Build & Deploy

# Builds on GitHub and rsyncs the standalone bundle to Plesk over SSH.
# The Plesk host can't build Next.js itself (glibc too old, CloudLinux limits).
#
# Repository secrets:
#   ENV_FILE         full contents of the production .env (deployed with the bundle)
#   SSH_PRIVATE_KEY  private key whose public half is in the server's authorized_keys
#   SSH_HOST, SSH_PORT, SSH_USER

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DEPLOY_PATH: "/var/www/vhosts/femigodpower.be/httpdocs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Without this the build falls back to mock data and a localhost site URL.
      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Repository secret ENV_FILE is missing."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify standalone build
        run: |
          test -f .next/standalone/server.js || {
            echo "Standalone build missing."
            echo "Make sure output: 'standalone' is set in next.config.ts"
            exit 1
          }

      - name: Prepare deployment
        run: |
          mkdir -p deployment

          cp -a .next/standalone/. deployment/

          if [ -d "public" ]; then
            cp -a public deployment/public
          fi

          mkdir -p deployment/.next
          cp -a .next/static deployment/.next/static

          # Plesk's nodenv picks the Node version from this file.
          cp .node-version deployment/
          cp .env deployment/.env

          # Plesk's startup file is app.js.
          printf '%s\n' \
            '// Plesk startup file: runs the standalone Next.js server built by GitHub Actions.' \
            'require("./server.js");' > deployment/app.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # --delete keeps httpdocs identical to the bundle, except for files the
      # server itself owns: Passenger's tmp/, the SSL challenge dir and the log.
      - name: Deploy to Plesk
        run: |
          rsync -az --delete \
            --exclude="tmp/" \
            --exclude=".well-known/" \
            --exclude="stderr.log" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            deployment/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/"

      - name: Restart application
        run: |
          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}/tmp' && touch '${DEPLOY_PATH}/tmp/restart.txt'"
