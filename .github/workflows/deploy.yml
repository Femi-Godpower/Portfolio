name: Build & Deploy

# Builds on GitHub and rsyncs the standalone bundle to Plesk over SSH.
# The Plesk host can't build Next.js itself (glibc too old, CloudLinux limits).
#
# Repository secrets:
#   ENV_FILE      full contents of the production .env (used for the build only;
#                 the server keeps its own .env, which rsync never touches)
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PASSWORD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DEPLOY_PATH: "/var/www/vhosts/femigodpower.be/httpdocs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Without this the build falls back to mock data and a localhost site URL.
      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Repository secret ENV_FILE is missing."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify standalone build
        run: |
          test -f .next/standalone/server.js || {
            echo "Standalone build missing."
            echo "Make sure output: 'standalone' is set in next.config.ts"
            exit 1
          }

      - name: Prepare deployment
        run: |
          mkdir -p deployment

          cp -a .next/standalone/. deployment/

          if [ -d "public" ]; then
            cp -a public deployment/public
          fi

          mkdir -p deployment/.next
          cp -a .next/static deployment/.next/static

          # Next copies .env into the standalone output; the server keeps its own.
          rm -f deployment/.env*

          # Plesk's nodenv picks the Node version from this file.
          cp .node-version deployment/

          # Plesk's startup file is app.js.
          printf '%s\n' \
            '// Plesk startup file: runs the standalone Next.js server built by GitHub Actions.' \
            'require("./server.js");' > deployment/app.js

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # --delete keeps httpdocs identical to the bundle, except for files the
      # server itself owns: .env, Passenger's tmp/, the SSL challenge dir and the log.
      - name: Deploy to Plesk
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude=".env" \
            --exclude="tmp/" \
            --exclude=".well-known/" \
            --exclude="stderr.log" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            deployment/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/"

      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}/tmp' && touch '${DEPLOY_PATH}/tmp/restart.txt'"
